<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T+0 历史分析</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #c9d1d9; --text-dim: #8b949e; --text-bright: #f0f6fc;
    --green: #3fb950; --red: #f85149; --blue: #58a6ff; --yellow: #d29922;
  }
  body { font-family: -apple-system, 'Microsoft YaHei', 'PingFang SC', sans-serif; background: var(--bg); color: var(--text); padding: 16px; max-width: 1200px; margin: 0 auto; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .header h1 { font-size: 22px; color: var(--blue); }
  .nav { display: flex; gap: 10px; }
  .nav a { color: var(--text-dim); text-decoration: none; font-size: 14px; padding: 6px 12px; border-radius: 6px; }
  .nav a:hover, .nav a.active { color: var(--blue); background: var(--surface); }
  .summary-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; text-align: center; }
  .summary-card .label { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .summary-card .value { font-size: 26px; font-weight: bold; }
  .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  @media (max-width: 768px) { .chart-row { grid-template-columns: 1fr; } }
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .chart-card h3 { color: var(--blue); font-size: 14px; margin-bottom: 12px; }
  .chart-card canvas { width: 100% !important; max-height: 280px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  th { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); color: var(--text-dim); font-weight: normal; }
  td { padding: 8px; border-bottom: 1px solid var(--border); }
  tr:hover { background: var(--surface); }
  .pos { color: var(--green); } .neg { color: var(--red); }
  .footer { text-align: center; color: #484f58; font-size: 11px; margin-top: 30px; padding-top: 12px; border-top: 1px solid var(--border); }
  .loading { text-align: center; color: var(--text-dim); padding: 40px; }
</style>
</head>
<body>
<div class="header">
  <h1>&#x1f4ca; T+0 历史分析</h1>
  <div class="nav">
    <a href="http://localhost:8899/dashboard.html">实时仪表盘</a>
    <a href="#" class="active">历史分析</a>
  </div>
</div>

<div class="summary-cards" id="summaryCards"><div class="loading">加载中...</div></div>

<div class="chart-row">
  <div class="chart-card"><h3>&#x1f4c8; 每日收益</h3><canvas id="dailyReturnChart"></canvas></div>
  <div class="chart-card"><h3>&#x1f4c8; 累计收益曲线</h3><canvas id="cumReturnChart"></canvas></div>
</div>

<div class="chart-row">
  <div class="chart-card"><h3>&#x1f4ca; 每日配对轮次 & 胜率</h3><canvas id="pairsChart"></canvas></div>
  <div class="chart-card"><h3>&#x1f3af; 个股表现排行</h3><canvas id="stockChart"></canvas></div>
</div>

<div class="chart-card" style="margin-bottom:20px">
  <h3>&#x1f4cb; 每日明细</h3>
  <div style="overflow-x:auto">
    <table id="detailTable"><thead><tr><th>日期</th><th>配对</th><th>总收益</th><th>胜率</th><th>强制平仓</th><th>正T/反T</th></tr></thead><tbody id="detailBody"></tbody></table>
  </div>
</div>

<div class="footer">T+0 日内盯盘系统 v2.0 &middot; 数据来源：westock-data &middot; 仅供参考</div>

<script>
const BASE = "http://localhost:8899/history/";

async function fetchJSON(url) {
  try { const r = await fetch(url + "?t=" + Date.now()); return r.ok ? await r.json() : null; }
  catch(e) { return null; }
}

function renderSummary(records) {
  if (!records.length) {
    document.getElementById("summaryCards").innerHTML = '<div class="loading">暂无历史数据</div>';
    return;
  }
  const totalDays = records.length;
  const totalReturn = records.reduce((s,r) => s + (r.totalReturn||0), 0);
  const avgReturn = totalReturn / totalDays;
  const avgWinRate = records.reduce((s,r) => s + (r.winRate||0), 0) / totalDays;
  const totalPairs = records.reduce((s,r) => s + (r.totalPairs||0), 0);
  const totalForced = records.reduce((s,r) => s + (r.forcedClose||0), 0);
  const bestDay = records.reduce((b,r) => (r.totalReturn||0) > (b?.totalReturn||-999) ? r : b, null);

  document.getElementById("summaryCards").innerHTML = `
    <div class="summary-card"><div class="label">交易天数</div><div class="value" style="color:var(--blue)">${totalDays}</div></div>
    <div class="summary-card"><div class="label">累计收益</div><div class="value ${totalReturn>=0?'pos':'neg'}">${totalReturn>=0?'+':''}${totalReturn.toFixed(2)}%</div></div>
    <div class="summary-card"><div class="label">日均收益</div><div class="value ${avgReturn>=0?'pos':'neg'}">${avgReturn>=0?'+':''}${avgReturn.toFixed(2)}%</div></div>
    <div class="summary-card"><div class="label">平均胜率</div><div class="value" style="color:var(--blue)">${avgWinRate.toFixed(1)}%</div></div>
    <div class="summary-card"><div class="label">总配对数 / 强平</div><div class="value" style="color:var(--blue)">${totalPairs} / ${totalForced}</div></div>
    <div class="summary-card"><div class="label">最佳单日</div><div class="value pos">${bestDay?.date?.slice(5) || '--'} +${bestDay?.totalReturn?.toFixed(1)||0}%</div></div>
  `;
}

function renderCharts(records) {
  if (!records.length) return;
  const dates = records.map(r => r.date.slice(5));
  const returns = records.map(r => r.totalReturn || 0);
  const pairs = records.map(r => r.totalPairs || 0);
  const winRates = records.map(r => r.winRate || 0);
  const cumReturns = []; let cum = 0;
  returns.forEach(r => { cum += r; cumReturns.push(parseFloat(cum.toFixed(2))); });

  // 每日收益柱状图
  new Chart(document.getElementById("dailyReturnChart"), {
    type: 'bar',
    data: {
      labels: dates,
      datasets: [{
        label: '日收益 %', data: returns,
        backgroundColor: returns.map(v => v >= 0 ? 'rgba(63,185,80,0.6)' : 'rgba(248,81,73,0.6)'),
        borderColor: returns.map(v => v >= 0 ? '#3fb950' : '#f85149'),
        borderWidth: 1
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#8b949e', maxRotation: 45, font: { size: 9 } }, grid: { color: '#30363d' } },
        y: { ticks: { color: '#8b949e' }, grid: { color: '#30363d' } }
      }
    }
  });

  // 累计收益
  new Chart(document.getElementById("cumReturnChart"), {
    type: 'line',
    data: {
      labels: dates,
      datasets: [{
        label: '累计收益 %', data: cumReturns,
        borderColor: '#58a6ff', backgroundColor: 'rgba(88,166,255,0.1)',
        fill: true, tension: 0.3, pointRadius: 3
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#8b949e', maxRotation: 45, font: { size: 9 } }, grid: { color: '#30363d' } },
        y: { ticks: { color: '#8b949e' }, grid: { color: '#30363d' } }
      }
    }
  });

  // 配对轮次 + 胜率
  new Chart(document.getElementById("pairsChart"), {
    type: 'bar',
    data: {
      labels: dates,
      datasets: [
        { label: '配对轮次', data: pairs, backgroundColor: 'rgba(88,166,255,0.4)', yAxisID: 'y' },
        { label: '胜率 %', data: winRates, type: 'line', borderColor: '#3fb950', yAxisID: 'y1', tension: 0.3, pointRadius: 2 }
      ]
    },
    options: {
      responsive: true,
      scales: {
        x: { ticks: { color: '#8b949e', maxRotation: 45, font: { size: 9 } }, grid: { color: '#30363d' } },
        y: { position: 'left', ticks: { color: '#8b949e' }, grid: { color: '#30363d' }, title: { display: true, text: '轮次', color: '#8b949e' } },
        y1: { position: 'right', min: 0, max: 100, ticks: { color: '#3fb950' }, grid: { display: false }, title: { display: true, text: '胜率%', color: '#3fb950' } }
      }
    }
  });
}

async function renderStockRanking() {
  // 汇总所有历史数据中的个股表现
  const summary = await fetchJSON(BASE + "history-summary.json");
  if (!summary) return;

  const stockStats = {};
  for (const day of summary) {
    const detail = await fetchJSON(BASE + day.date + ".json");
    if (!detail || !detail.stocks) continue;
    for (const [code, state] of Object.entries(detail.stocks)) {
      if (!state.completedRounds || !state.completedRounds.length) continue;
      if (!stockStats[code]) stockStats[code] = { name: state.name || code, pairs: 0, return: 0, wins: 0 };
      state.completedRounds.forEach(r => {
        stockStats[code].pairs++;
        stockStats[code].return += r.netReturn || 0;
        if ((r.netReturn || 0) > 0) stockStats[code].wins++;
      });
    }
  }

  const sorted = Object.entries(stockStats).sort((a,b) => b[1].return - a[1].return).slice(0, 15);
  new Chart(document.getElementById("stockChart"), {
    type: 'bar',
    data: {
      labels: sorted.map(([code, s]) => s.name),
      datasets: [{
        label: '累计收益 %', data: sorted.map(([c, s]) => parseFloat(s.return.toFixed(2))),
        backgroundColor: sorted.map(([c,s]) => s.return >= 0 ? 'rgba(63,185,80,0.5)' : 'rgba(248,81,73,0.5)'),
        borderColor: sorted.map(([c,s]) => s.return >= 0 ? '#3fb950' : '#f85149'),
        borderWidth: 1
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#8b949e' }, grid: { color: '#30363d' } },
        y: { ticks: { color: '#c9d1d9', font: { size: 11 } }, grid: { color: '#30363d' } }
      }
    }
  });
}

function renderTable(records) {
  const tbody = document.getElementById("detailBody");
  tbody.innerHTML = records.map(r => `
    <tr>
      <td><a href="#" onclick="loadDayDetail('${r.date}');return false" style="color:var(--blue)">${r.date}</a></td>
      <td>${r.totalPairs}</td>
      <td class="${(r.totalReturn||0) >= 0 ? 'pos' : 'neg'}">${(r.totalReturn||0) >= 0 ? '+' : ''}${(r.totalReturn||0).toFixed(2)}%</td>
      <td>${r.winRate}%</td>
      <td>${r.forcedClose || 0}</td>
      <td style="font-size:11px;color:var(--text-dim)">--</td>
    </tr>
  `).reverse().join('');
}

async function loadDayDetail(date) {
  const detail = await fetchJSON(BASE + date + ".json");
  if (!detail) { alert("无法加载 " + date + " 的详细数据"); return; }
  const pairs = detail.completedPairs || [];
  const info = pairs.map(p => {
    const isPos = p.type === "正T";
    return `${p.type}轮${p.round}: ${isPos ? p.buyTime+'买@'+p.buyPrice+'→'+p.sellTime+'卖@'+p.sellPrice : p.sellTime+'卖@'+p.sellPrice+'→'+p.buyTime+'买@'+p.buyPrice} | ${p.netReturn>=0?'+':''}${p.netReturn}%`;
  }).join('\n');
  alert(`${date} 完成${pairs.length}轮配对:\n\n${info || '无配对记录'}`);
}

async function init() {
  const summary = await fetchJSON(BASE + "history-summary.json");
  const records = summary || [];
  renderSummary(records);
  renderCharts(records);
  renderTable(records);
  renderStockRanking();
}

init();
</script>
</body>
</html>
